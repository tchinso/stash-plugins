name: Player Playlist Controls
description: Repeat scenes, play shuffled folder or performer queues, and open original files in an external media player.
version: "1.1.0"
ui:
  javascript:
    - PlayerPlaylistControls.js
    - ExternalMediaPlayer.js
  css:
    - PlayerPlaylistControls.css
settings:
  mediaPlayerPath:
    displayName: 외부 플레이어 실행 파일 경로
    description: PotPlayer 또는 VLC 등의 실행 파일 전체 경로. 비워 두면 stashOpenMediaPlayer의 기존 설정을 사용합니다.
    type: STRING
exec:
  - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  - -NoProfile
  - -NonInteractive
  - -WindowStyle
  - Hidden
  - -Command
  - >-
    & ([scriptblock]::Create([System.IO.File]::ReadAllText('{pluginDir}/OpenMediaPlayer.ps1')))
interface: raw
